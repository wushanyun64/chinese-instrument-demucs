[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-instrument-demucs"
version = "0.1.0"
description = "Single-target Demucs source separator for Chinese instruments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "soundfile>=0.12",
    "numpy",
    # Demucs vendored dependencies
    "dora-search",
    "hydra-core",
    "omegaconf",
    "julius",
    "openunmix",
    "einops",
    # Evaluation / analysis
    "museval>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "nbmake",
    "matplotlib",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[tool.setuptools.packages.find]
include = ["data_pipeline*", "training*", "inference*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
